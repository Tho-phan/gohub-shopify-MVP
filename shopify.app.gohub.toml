# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f0f947615dbd970030325817461a270c"
application_url = "https://example.com"
embedded = true
name = "gohub"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_products,write_publications"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2027-01"

  # TEMPORARILY DISABLED for `shopify app dev --use-localhost`: Shopify rejects
  # https://localhost webhook URIs, which aborts dev preview. RESTORE (uncomment) these
  # when running with a real tunnel (hotspot / ngrok) so orders/paid provisioning fires.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/app/uninstalled"
  # topics = [ "app/uninstalled" ]
  #
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/app/scopes_update"
  # topics = [ "app/scopes_update" ]
  #
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/paid"
  # topics = [ "orders/paid" ]

  # Mandatory privacy/compliance webhooks (named URL keys, NOT subscriptions).
  # ALSO disabled for --use-localhost ("cannot be a Shopify or an internal domain").
  # RESTORE together with the subscriptions above when running on a real tunnel.
  # [webhooks.privacy_compliance]
  # customer_data_request_url = "/webhooks/customers/data_request"
  # customer_deletion_url = "/webhooks/customers/redact"
  # shop_deletion_url = "/webhooks/shop/redact"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
